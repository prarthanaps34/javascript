<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>userprofile</title>
</head>
<body>
<script>
let userprofile = {
    username:"cooluser100",
    bio:"I LOVE coding! JavaScript is Great!!!"
};
function cleaneduser(profile) {
   let cleanedusername = profile.username.trim().toLowerCase();
    let cleanedbio = profile.bio.trim().toLowerCase();

     cleanedbio = cleanedbio.replace(/javascript/g,"JS");
    let biolength = cleanedbio.length;
return {
    username :cleanedusername,
    bio :cleanedbio,
    biolength:biolength
};
    
    
}
let result=cleaneduser(userprofile);
console.log(result);

</script> 
</body>
</html>
