<body>
    <script>
        var feedback ="  I loved the food and service! ";
        function cleanfeedback(text){
            text=text.trim();

            text=text.replace("food","ambience");
            console.log("feedback",text);
            var position = text.indexOf("service");
           console.log("position of service",position);
            var word = text.split(" ");
            console.log("array of words",word);
            
        }
        cleanfeedback(feedback);
    </script>
